<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FitPulse - Personal Fitness Tracker</title>
    <!-- iOS Web App Capable -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="FitPulse">
    <link rel="apple-touch-icon" href="icon.png">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#ecfdf5',
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans pb-24 antialiased selection:bg-emerald-500 selection:text-white" x-data="fitnessApp()">

    <!-- TOP HEADER & DATE PICKER -->
    <header class="sticky top-0 z-40 bg-slate-900/80 backdrop-blur-md border-b border-slate-800 px-4 py-3 flex items-center justify-between">
        <div class="flex items-center gap-2">
            <div class="p-2 bg-emerald-500/10 text-emerald-400 rounded-xl border border-emerald-500/20">
                <i data-lucide="activity" class="w-5 h-5"></i>
            </div>
            <h1 class="text-xl font-bold bg-gradient-to-r from-emerald-400 to-teal-200 bg-clip-text text-transparent">FitPulse</h1>
        </div>
        
        <!-- Date Switcher -->
        <div class="flex items-center gap-2 bg-slate-800/80 rounded-xl p-1 border border-slate-700/50">
            <button @click="changeDate(-1)" class="p-1 text-slate-400 hover:text-white transition"><i data-lucide="chevron-left" class="w-4 h-4"></i></button>
            <input type="date" x-model="selectedDate" @change="loadDateData()" class="bg-transparent text-xs text-slate-200 font-medium focus:outline-none cursor-pointer">
            <button @click="changeDate(1)" class="p-1 text-slate-400 hover:text-white transition"><i data-lucide="chevron-right" class="w-4 h-4"></i></button>
        </div>
    </header>

    <!-- MAIN CONTENT CONTAINERS -->
    <main class="max-w-lg mx-auto p-4 space-y-6">

        <!-- TAB 1: DASHBOARD / OVERVIEW -->
        <div x-show="currentTab === 'dashboard'" class="space-y-6">
            <!-- Calorie Card -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl space-y-4">
                <div class="flex justify-between items-center">
                    <span class="text-sm text-slate-400 font-medium">Daily Calories</span>
                    <button @click="currentTab = 'nutrition'" class="text-xs text-emerald-400 font-medium flex items-center gap-1 hover:underline">
                        Details <i data-lucide="arrow-right" class="w-3 h-3"></i>
                    </button>
                </div>
                <div class="flex items-center justify-between">
                    <div>
                        <div class="text-3xl font-extrabold text-white" x-text="consumedCalories"></div>
                        <div class="text-xs text-slate-400">of <span x-text="targets.calories"></span> kcal target</div>
                    </div>
                    <div class="w-20 h-20 relative">
                        <canvas id="calorieChart"></canvas>
                    </div>
                </div>
                <!-- Macros Summary Bar -->
                <div class="grid grid-cols-3 gap-2 pt-2 border-t border-slate-800 text-center">
                    <div class="bg-slate-800/40 p-2 rounded-xl">
                        <div class="text-[10px] text-slate-400 uppercase font-semibold">Protein</div>
                        <div class="text-sm font-bold text-emerald-400" x-text="consumedMacros.p + 'g / ' + targets.p + 'g'"></div>
                    </div>
                    <div class="bg-slate-800/40 p-2 rounded-xl">
                        <div class="text-[10px] text-slate-400 uppercase font-semibold">Carbs</div>
                        <div class="text-sm font-bold text-amber-400" x-text="consumedMacros.c + 'g / ' + targets.c + 'g'"></div>
                    </div>
                    <div class="bg-slate-800/40 p-2 rounded-xl">
                        <div class="text-[10px] text-slate-400 uppercase font-semibold">Fats</div>
                        <div class="text-sm font-bold text-rose-400" x-text="consumedMacros.f + 'g / ' + targets.f + 'g'"></div>
                    </div>
                </div>
            </div>

            <!-- Workout Summary Card -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl space-y-3">
                <div class="flex justify-between items-center">
                    <span class="text-sm text-slate-400 font-medium">Today's Workout Metrics</span>
                    <button @click="currentTab = 'workout'" class="text-xs text-emerald-400 font-medium flex items-center gap-1 hover:underline">
                        Gym Log <i data-lucide="arrow-right" class="w-3 h-3"></i>
                    </button>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div class="bg-slate-800/50 border border-slate-700/50 p-3 rounded-xl flex items-center gap-3">
                        <div class="p-2 bg-indigo-500/10 text-indigo-400 rounded-lg"><i data-lucide="clock" class="w-5 h-5"></i></div>
                        <div>
                            <div class="text-[10px] text-slate-400">Duration</div>
                            <div class="text-sm font-bold text-indigo-400" x-text="formattedWorkoutTimer"></div>
                        </div>
                    </div>
                    <div class="bg-slate-800/50 border border-slate-700/50 p-3 rounded-xl flex items-center gap-3">
                        <div class="p-2 bg-purple-500/10 text-purple-400 rounded-lg"><i data-lucide="layers" class="w-5 h-5"></i></div>
                        <div>
                            <div class="text-[10px] text-slate-400">Total Sets</div>
                            <div class="text-sm font-bold" x-text="workoutMetrics.sets"></div>
                        </div>
                    </div>
                    <div class="bg-slate-800/50 border border-slate-700/50 p-3 rounded-xl flex items-center gap-3">
                        <div class="p-2 bg-blue-500/10 text-blue-400 rounded-lg"><i data-lucide="dumbbell" class="w-5 h-5"></i></div>
                        <div>
                            <div class="text-[10px] text-slate-400">Total Volume</div>
                            <div class="text-sm font-bold" x-text="workoutMetrics.volume + ' kg'"></div>
                        </div>
                    </div>
                    <div class="bg-slate-800/50 border border-slate-700/50 p-3 rounded-xl flex items-center gap-3">
                        <div class="p-2 bg-amber-500/10 text-amber-400 rounded-lg"><i data-lucide="trophy" class="w-5 h-5"></i></div>
                        <div>
                            <div class="text-[10px] text-slate-400">Max Weight</div>
                            <div class="text-sm font-bold" x-text="workoutMetrics.maxWeight + ' kg'"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Body Weight Tracker Card -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl space-y-3">
                <div class="flex justify-between items-center">
                    <span class="text-sm text-slate-400 font-medium">Weight Tracker</span>
                    <span class="text-xs text-slate-500">Selected Date Log</span>
                </div>
                <div class="flex items-center gap-3">
                    <input type="number" step="0.1" x-model.number="currentWeight" placeholder="e.g. 72.5" class="bg-slate-800 border border-slate-700 text-white text-sm rounded-xl p-2.5 flex-1 focus:ring-1 focus:ring-emerald-500 focus:outline-none">
                    <button @click="saveWeight()" class="px-4 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold rounded-xl transition">
                        Save
                    </button>
                </div>
            </div>
        </div>

        <!-- TAB 2: NUTRITION (BitePal Style) -->
        <div x-show="currentTab === 'nutrition'" class="space-y-6" x-cloak>
            <!-- Target Settings Modal Trigger / Bar -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex justify-between items-center">
                <div>
                    <div class="text-xs text-slate-400">Custom Daily Targets</div>
                    <div class="text-sm font-semibold text-slate-200" x-text="targets.calories + ' kcal | P:' + targets.p + 'g C:' + targets.c + 'g F:' + targets.f + 'g'"></div>
                </div>
                <button @click="showTargetModal = true" class="p-2 bg-slate-800 hover:bg-slate-700 rounded-xl text-slate-300 transition">
                    <i data-lucide="settings" class="w-4 h-4"></i>
                </button>
            </div>

            <!-- Meals List -->
            <div class="space-y-4">
                <template x-for="(mealItems, mealName) in foodLogs" :key="mealName">
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3">
                        <div class="flex justify-between items-center border-b border-slate-800/80 pb-2">
                            <span class="font-bold text-slate-200 capitalize" x-text="mealName"></span>
                            <button @click="openAddFoodModal(mealName)" class="text-xs text-emerald-400 hover:text-emerald-300 font-medium flex items-center gap-1">
                                <i data-lucide="plus" class="w-3 h-3"></i> Add Food
                            </button>
                        </div>

                        <!-- Food Items -->
                        <div class="space-y-2">
                            <template x-for="(food, idx) in mealItems" :key="idx">
                                <div class="flex justify-between items-center bg-slate-800/30 p-2.5 rounded-xl border border-slate-800/50">
                                    <div>
                                        <div class="text-sm font-medium text-slate-200" x-text="food.name"></div>
                                        <div class="text-[11px] text-slate-400" x-text="food.calories + ' kcal • P:' + food.p + 'g C:' + food.c + 'g F:' + food.f + 'g'"></div>
                                    </div>
                                    <button @click="removeFood(mealName, idx)" class="text-slate-500 hover:text-rose-400 p-1">
                                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                                    </button>
                                </div>
                            </template>
                            <div x-show="mealItems.length === 0" class="text-xs text-slate-500 italic py-1">No items logged yet</div>
                        </div>
                    </div>
                </template>
            </div>
        </div>

        <!-- TAB 3: WORKOUT (Hevy Style) -->
        <div x-show="currentTab === 'workout'" class="space-y-6" x-cloak>
            
            <!-- Workout Control Header & Live Timer -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3 shadow-xl">
                <div class="flex justify-between items-center">
                    <div class="flex items-center gap-2">
                        <span class="font-bold text-slate-200">Active Workout Session</span>
                        <span x-show="isTimerRunning" class="flex h-2 w-2 relative">
                          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                          <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                        </span>
                    </div>
             <!-- MODAL: WORKOUT TEMPLATES -->
<div x-show="showTemplateModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4" x-cloak>
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 max-w-sm w-full space-y-4 max-h-[80vh] overflow-y-auto">
        <div class="flex justify-between items-center">
            <h3 class="font-bold text-slate-100">Workout Templates</h3>
            <button @click="showTemplateModal = false" class="text-slate-500 hover:text-white"><i data-lucide="x" class="w-4 h-4"></i></button>
        </div>

        <!-- List of Saved Templates (Dengan Tombol Delete) -->
        <div class="space-y-2">
            <template x-for="(tmpl, tIdx) in workoutTemplates" :key="tIdx">
                <div class="bg-slate-800/60 p-3 rounded-xl flex justify-between items-center border border-slate-700/40">
                    <div>
                        <div class="font-semibold text-sm text-slate-200" x-text="tmpl.title"></div>
                        <div class="text-[10px] text-slate-400" x-text="tmpl.exercises.length + ' exercises'"></div>
                    </div>
                    
                    <!-- Aksi: Tombol Load + Tombol Delete -->
                    <div class="flex items-center gap-1.5">
                        <button @click="loadTemplate(tmpl)" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold rounded-lg transition">
                            Load
                        </button>
                        <button @click="deleteTemplate(tIdx)" class="p-1.5 text-rose-400 hover:text-rose-300 bg-rose-500/10 hover:bg-rose-500/20 rounded-lg border border-rose-500/20 transition" title="Delete Template">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>
            </template>
            <div x-show="workoutTemplates.length === 0" class="text-xs text-slate-500 italic py-2 text-center">No saved templates yet.</div>
        </div>

        <button @click="saveCurrentAsTemplate()" class="w-full py-2.5 bg-slate-800 hover:bg-slate-700 text-emerald-400 text-xs font-semibold rounded-xl border border-slate-700 transition">
            + Save Current Session as Template
        </button>
    </div>
</div>
                </div>

                <!-- Hevy Style Live Stopwatch Controller -->
                <div class="bg-slate-800/70 rounded-xl p-3 border border-slate-700/50 flex items-center justify-between">
                    <div>
                        <div class="text-[10px] text-slate-400 uppercase font-semibold tracking-wider">Workout Duration</div>
                        <div class="text-2xl font-extrabold text-indigo
