<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FitPulse - Personal Fitness Tracker</title>
    <!-- iOS Web App Capable -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="FitPulse">
    <link rel="apple-touch-icon" href="icon.png">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#ecfdf5',
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans pb-24 antialiased selection:bg-emerald-500 selection:text-white" x-data="fitnessApp()">

    <!-- TOP HEADER & DATE PICKER -->
    <header class="sticky top-0 z-40 bg-slate-900/80 backdrop-blur-md border-b border-slate-800 px-4 py-3 flex items-center justify-between">
        <div class="flex items-center gap-2">
            <div class="p-2 bg-emerald-500/10 text-emerald-400 rounded-xl border border-emerald-500/20">
                <i data-lucide="activity" class="w-5 h-5"></i>
            </div>
            <h1 class="text-xl font-bold bg-gradient-to-r from-emerald-400 to-teal-200 bg-clip-text text-transparent">FitPulse</h1>
        </div>
        
        <!-- Date Switcher -->
        <div class="flex items-center gap-2 bg-slate-800/80 rounded-xl p-1 border border-slate-700/50">
            <button @click="changeDate(-1)" class="p-1 text-slate-400 hover:text-white transition"><i data-lucide="chevron-left" class="w-4 h-4"></i></button>
            <input type="date" x-model="selectedDate" @change="loadDateData()" class="bg-transparent text-xs text-slate-200 font-medium focus:outline-none cursor-pointer">
            <button @click="changeDate(1)" class="p-1 text-slate-400 hover:text-white transition"><i data-lucide="chevron-right" class="w-4 h-4"></i></button>
        </div>
    </header>

    <!-- MAIN CONTENT CONTAINERS -->
    <main class="max-w-lg mx-auto p-4 space-y-6">

        <!-- TAB 1: DASHBOARD / OVERVIEW -->
        <div x-show="currentTab === 'dashboard'" class="space-y-6">
            <!-- Calorie Card -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl space-y-4">
                <div class="flex justify-between items-center">
                    <span class="text-sm text-slate-400 font-medium">Daily Calories</span>
                    <button @click="switchTab('nutrition')" class="text-xs text-emerald-400 font-medium flex items-center gap-1 hover:underline">
                        Details <i data-lucide="arrow-right" class="w-3 h-3"></i>
                    </button>
                </div>
                <div class="flex items-center justify-between">
                    <div>
                        <div class="text-3xl font-extrabold text-white" x-text="consumedCalories"></div>
                        <div class="text-xs text-slate-400">of <span x-text="targets.calories"></span> kcal target</div>
                    </div>
                    <div class="w-20 h-20 relative">
                        <canvas id="calorieChart"></canvas>
                    </div>
                </div>
                <!-- Macros Summary Bar -->
                <div class="grid grid-cols-3 gap-2 pt-2 border-t border-slate-800 text-center">
                    <div class="bg-slate-800/40 p-2 rounded-xl">
                        <div class="text-[10px] text-slate-400 uppercase font-semibold">Protein</div>
                        <div class="text-sm font-bold text-emerald-400" x-text="consumedMacros.p + 'g / ' + targets.p + 'g'"></div>
                    </div>
                    <div class="bg-slate-800/40 p-2 rounded-xl">
                        <div class="text-[10px] text-slate-400 uppercase font-semibold">Carbs</div>
                        <div class="text-sm font-bold text-amber-400" x-text="consumedMacros.c + 'g / ' + targets.c + 'g'"></div>
                    </div>
                    <div class="bg-slate-800/40 p-2 rounded-xl">
                        <div class="text-[10px] text-slate-400 uppercase font-semibold">Fats</div>
                        <div class="text-sm font-bold text-rose-400" x-text="consumedMacros.f + 'g / ' + targets.f + 'g'"></div>
                    </div>
                </div>
            </div>

            <!-- Workout Summary Card -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl space-y-3">
                <div class="flex justify-between items-center">
                    <span class="text-sm text-slate-400 font-medium">Today's Workout Metrics</span>
                    <button @click="switchTab('workout')" class="text-xs text-emerald-400 font-medium flex items-center gap-1 hover:underline">
                        Gym Log <i data-lucide="arrow-right" class="w-3 h-3"></i>
                    </button>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div class="bg-slate-800/50 border border-slate-700/50 p-3 rounded-xl flex items-center gap-3">
                        <div class="p-2 bg-indigo-500/10 text-indigo-400 rounded-lg"><i data-lucide="clock" class="w-5 h-5"></i></div>
                        <div>
                            <div class="text-[10px] text-slate-400">Duration</div>
                            <div class="text-sm font-bold" x-text="workoutMetrics.duration + ' mins'"></div>
                        </div>
                    </div>
                    <div class="bg-slate-800/50 border border-slate-700/50 p-3 rounded-xl flex items-center gap-3">
                        <div class="p-2 bg-purple-500/10 text-purple-400 rounded-lg"><i data-lucide="layers" class="w-5 h-5"></i></div>
                        <div>
                            <div class="text-[10px] text-slate-400">Total Sets</div>
                            <div class="text-sm font-bold" x-text="workoutMetrics.sets"></div>
                        </div>
                    </div>
                    <div class="bg-slate-800/50 border border-slate-700/50 p-3 rounded-xl flex items-center gap-3">
                        <div class="p-2 bg-blue-500/10 text-blue-400 rounded-lg"><i data-lucide="dumbbell" class="w-5 h-5"></i></div>
                        <div>
                            <div class="text-[10px] text-slate-400">Total Volume</div>
                            <div class="text-sm font-bold" x-text="workoutMetrics.volume + ' kg'"></div>
                        </div>
                    </div>
                    <div class="bg-slate-800/50 border border-slate-700/50 p-3 rounded-xl flex items-center gap-3">
                        <div class="p-2 bg-amber-500/10 text-amber-400 rounded-lg"><i data-lucide="trophy" class="w-5 h-5"></i></div>
                        <div>
                            <div class="text-[10px] text-slate-400">Max Weight</div>
                            <div class="text-sm font-bold" x-text="workoutMetrics.maxWeight + ' kg'"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Body Weight Tracker Card -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl space-y-3">
                <div class="flex justify-between items-center">
                    <span class="text-sm text-slate-400 font-medium">Weight Tracker</span>
                    <span class="text-xs text-slate-500">Selected Date Log</span>
                </div>
                <div class="flex items-center gap-3">
                    <input type="number" step="0.1" x-model.number="currentWeight" placeholder="e.g. 72.5" class="bg-slate-800 border border-slate-700 text-white text-sm rounded-xl p-2.5 flex-1 focus:ring-1 focus:ring-emerald-500 focus:outline-none">
                    <button @click="saveWeight()" class="px-4 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold rounded-xl transition">
                        Save
                    </button>
                </div>
            </div>
        </div>

        <!-- TAB 2: NUTRITION -->
        <div x-show="currentTab === 'nutrition'" class="space-y-6" x-cloak>
            <!-- Target Settings Bar -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex justify-between items-center">
                <div>
                    <div class="text-xs text-slate-400">Custom Daily Targets</div>
                    <div class="text-sm font-semibold text-slate-200" x-text="targets.calories + ' kcal | P:' + targets.p + 'g C:' + targets.c + 'g F:' + targets.f + 'g'"></div>
                </div>
                <button @click="openTargetModal()" class="p-2 bg-slate-800 hover:bg-slate-700 rounded-xl text-slate-300 transition">
                    <i data-lucide="settings" class="w-4 h-4"></i>
                </button>
            </div>

            <!-- Meals List -->
            <div class="space-y-4">
                <template x-for="(mealItems, mealName) in foodLogs" :key="mealName">
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3">
                        <div class="flex justify-between items-center border-b border-slate-800/80 pb-2">
                            <span class="font-bold text-slate-200 capitalize" x-text="mealName"></span>
                            <button @click="openAddFoodModal(mealName)" class="text-xs text-emerald-400 hover:text-emerald-300 font-medium flex items-center gap-1">
                                <i data-lucide="plus" class="w-3 h-3"></i> Add Food
                            </button>
                        </div>

                        <!-- Food Items -->
                        <div class="space-y-2">
                            <template x-for="(food, idx) in mealItems" :key="idx">
                                <div class="flex justify-between items-center bg-slate-800/30 p-2.5 rounded-xl border border-slate-800/50">
                                    <div>
                                        <div class="text-sm font-medium text-slate-200" x-text="food.name"></div>
                                        <div class="text-[11px] text-slate-400" x-text="food.calories + ' kcal • P:' + food.p + 'g C:' + food.c + 'g F:' + food.f + 'g'"></div>
                                    </div>
                                    <div class="flex items-center gap-1">
                                        <button @click="openEditFoodModal(mealName, idx, food)" class="text-slate-400 hover:text-emerald-400 p-1 transition" title="Edit">
                                            <i data-lucide="edit-3" class="w-4 h-4"></i>
                                        </button>
                                        <button @click="removeFood(mealName, idx)" class="text-slate-500 hover:text-rose-400 p-1 transition" title="Delete">
                                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                                        </button>
                                    </div>
                                </div>
                            </template>
                            <div x-show="mealItems.length === 0" class="text-xs text-slate-500 italic py-1">No items logged yet</div>
                        </div>
                    </div>
                </template>
            </div>
        </div>

        <!-- TAB 3: WORKOUT -->
        <div x-show="currentTab === 'workout'" class="space-y-6" x-cloak>
            
            <!-- Workout Control Header & Stopwatch -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3">
                <div class="flex justify-between items-center">
                    <span class="font-bold text-slate-200">Active Workout Session</span>
                    <button @click="showTemplateModal = true" class="text-xs text-emerald-400 font-medium flex items-center gap-1 bg-emerald-500/10 px-3 py-1.5 rounded-xl border border-emerald-500/20">
                        <i data-lucide="folder-plus" class="w-3 h-3"></i> Templates
                    </button>
                </div>
                
                <div class="flex items-center gap-3 pt-2">
                    <!-- Live Stopwatch Widget -->
                    <div class="flex-1 bg-slate-800 rounded-xl p-2.5 text-center border border-slate-700/50 flex items-center justify-between px-4">
                        <div>
                            <div class="text-[10px] text-slate-400 text-left">Duration (Stopwatch)</div>
                            <div class="text-sm font-bold text-emerald-400 text-left" x-text="formattedStopwatch"></div>
                        </div>
                        <button @click="toggleStopwatch()" :class="isTimerRunning ? 'bg-rose-500/20 text-rose-400 border-rose-500/30' : 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30'" class="px-3 py-1.5 rounded-lg border text-xs font-bold transition flex items-center gap-1">
                            <i :data-lucide="isTimerRunning ? 'pause' : 'play'" class="w-3.5 h-3.5"></i>
                            <span x-text="isTimerRunning ? 'Pause' : 'Start'"></span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Exercises Cards Container -->
            <div class="space-y-4">
                <template x-for="(exercise, exIdx) in activeSession.exercises" :key="exIdx">
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3">
                        <div class="flex justify-between items-center">
                            <input type="text" x-model="exercise.name" @input="saveWorkoutData()" class="bg-transparent font-bold text-slate-200 focus:bg-slate-800 rounded px-1 text-sm focus:outline-none" placeholder="Exercise Name">
                            <button @click="removeExercise(exIdx)" class="text-slate-500 hover:text-rose-400 transition"><i data-lucide="x" class="w-4 h-4"></i></button>
                        </div>

                        <!-- Sets Table -->
                        <div class="space-y-2">
                            <div class="grid grid-cols-12 text-[10px] text-slate-400 text-center font-semibold uppercase">
                                <span class="col-span-2">Set</span>
                                <span class="col-span-4">kg</span>
                                <span class="col-span-4">Reps</span>
                                <span class="col-span-2">Del</span>
                            </div>

                            <template x-for="(set, setIdx) in exercise.sets" :key="setIdx">
                                <div class="grid grid-cols-12 gap-2 items-center text-center">
                                    <span class="col-span-2 text-xs font-bold text-slate-400" x-text="setIdx + 1"></span>
                                    <input type="number" x-model.number="set.weight" @input="saveWorkoutData()" class="col-span-4 bg-slate-800 text-center text-xs text-white rounded-lg p-1.5 border border-slate-700/50 focus:outline-none">
                                    <input type="number" x-model.number="set.reps" @input="saveWorkoutData()" class="col-span-4 bg-slate-800 text-center text-xs text-white rounded-lg p-1.5 border border-slate-700/50 focus:outline-none">
                                    <button @click="removeSet(exIdx, setIdx)" class="col-span-2 text-slate-500 hover:text-rose-400 flex justify-center transition"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
                                </div>
                            </template>
                        </div>

                        <button @click="addSet(exIdx)" class="w-full py-1.5 bg-slate-800/60 hover:bg-slate-800 text-slate-300 text-xs font-medium rounded-xl border border-dashed border-slate-700 transition flex items-center justify-center gap-1">
                            <i data-lucide="plus" class="w-3 h-3"></i> Add Set
                        </button>
                    </div>
                </template>
            </div>

            <!-- Single Main Add Exercise Button at the bottom -->
            <button @click="addExerciseToSession()" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-xs rounded-2xl shadow-lg transition flex items-center justify-center gap-1.5">
                <i data-lucide="plus-circle" class="w-4 h-4"></i> Add Exercise
            </button>
        </div>
    </main>

    <!-- MODAL: CUSTOM TARGETS -->
    <div x-show="showTargetModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4" x-transition x-cloak>
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 max-w-sm w-full space-y-4" @click.away="showTargetModal = false">
            <h3 class="font-bold text-slate-100">Set Daily Nutrition Targets</h3>
            <div class="space-y-3">
                <div>
                    <label class="text-xs text-slate-400">Daily Calories (kcal)</label>
                    <input type="number" x-model.number="tempTargets.calories" class="w-full bg-slate-800 border border-slate-700 text-white rounded-xl p-2 text-sm mt-1 focus:outline-none">
                </div>
                <div class="grid grid-cols-3 gap-2">
                    <div>
                        <label class="text-xs text-slate-400">Protein (g)</label>
                        <input type="number" x-model.number="tempTargets.p" class="w-full bg-slate-800 border border-slate-700 text-white rounded-xl p-2 text-sm mt-1 focus:outline-none">
                    </div>
                    <div>
                        <label class="text-xs text-slate-400">Carbs (g)</label>
                        <input type="number" x-model.number="tempTargets.c" class="w-full bg-slate-800 border border-slate-700 text-white rounded-xl p-2 text-sm mt-1 focus:outline-none">
                    </div>
                    <div>
                        <label class="text-xs text-slate-400">Fats (g)</label>
                        <input type="number" x-model.number="tempTargets.f" class="w-full bg-slate-800 border border-slate-700 text-white rounded-xl p-2 text-sm mt-1 focus:outline-none">
                    </div>
                </div>
            </div>
            <div class="flex justify-end gap-2 pt-2">
                <button @click="showTargetModal = false" class="px-4 py-2 text-xs text-slate-400 hover:text-white">Cancel</button>
                <button @click="saveTargets()" class="px-4 py-2 bg-emerald-600 text-white text-xs font-bold rounded-xl">Save Targets</button>
            </div>
        </div>
    </div>

    <!-- MODAL: ADD / EDIT FOOD ITEM -->
    <div x-show="showFoodModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4" x-transition x-cloak>
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 max-w-sm w-full space-y-3" @click.away="showFoodModal = false">
            <h3 class="font-bold text-slate-100">
                <span x-text="editIndex === null ? 'Add Food to ' : 'Edit Food in '"></span>
                <span class="capitalize text-emerald-400" x-text="activeMeal"></span>
            </h3>
            <input type="text" x-model="newFood.name" placeholder="Food Name" class="w-full bg-slate-800 border border-slate-700 text-white rounded-xl p-2 text-sm focus:outline-none">
            <div class="grid grid-cols-2 gap-2">
                <input type="number" x-model.number="newFood.calories" placeholder="Calories" class="bg-slate-800 border border-slate-700 text-white rounded-xl p-2 text-sm focus:outline-none">
                <input type="number" x-model.number="newFood.p" placeholder="Protein (g)" class="bg-slate-800 border border-slate-700 text-white rounded-xl p-2 text-sm focus:outline-none">
                <input type="number" x-model.number="newFood.c" placeholder="Carbs (g)" class="bg-slate-800 border border-slate-700 text-white rounded-xl p-2 text-sm focus:outline-none">
                <input type="number" x-model.number="newFood.f" placeholder="Fats (g)" class="bg-slate-800 border border-slate-700 text-white rounded-xl p-2 text-sm focus:outline-none">
            </div>
            <div class="flex justify-end gap-2 pt-2">
                <button @click="showFoodModal = false" class="px-4 py-2 text-xs text-slate-400 hover:text-white">Cancel</button>
                <button @click="saveFoodItem()" class="px-4 py-2 bg-emerald-600 text-white text-xs font-bold rounded-xl" x-text="editIndex === null ? 'Add Item' : 'Save Changes'"></button>
            </div>
        </div>
    </div>

    <!-- MODAL: WORKOUT TEMPLATES -->
    <div x-show="showTemplateModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4" x-transition x-cloak>
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 max-w-sm w-full space-y-4 max-h-[80vh] overflow-y-auto" @click.away="showTemplateModal = false">
            <div class="flex justify-between items-center">
                <h3 class="font-bold text-slate-100">Workout Templates</h3>
                <button @click="showTemplateModal = false" class="text-slate-500 hover:text-white"><i data-lucide="x" class="w-4 h-4"></i></button>
            </div>

            <!-- List of Saved Templates -->
            <div class="space-y-2">
                <template x-for="(tmpl, tIdx) in workoutTemplates" :key="tIdx">
                    <div class="bg-slate-800/60 p-3 rounded-xl flex justify-between items-center border border-slate-700/40">
                        <div>
                            <div class="font-semibold text-sm text-slate-200" x-text="tmpl.title"></div>
                            <div class="text-[10px] text-slate-400" x-text="tmpl.exercises.length + ' exercises'"></div>
                        </div>
                        <div class="flex items-center gap-1">
                            <button @click="loadTemplate(tmpl)" class="px-2.5 py-1 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold rounded-lg">Load</button>
                            <button @click="deleteTemplate(tIdx)" class="p-1 text-slate-500 hover:text-rose-400 transition"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
                        </div>
                    </div>
                </template>
            </div>

            <button @click="saveCurrentAsTemplate()" class="w-full py-2 bg-slate-800 hover:bg-slate-700 text-emerald-400 text-xs font-semibold rounded-xl border border-slate-700 transition">
                + Save Current Session as Template
            </button>
        </div>
    </div>

    <!-- BOTTOM NAVIGATION BAR -->
    <nav class="fixed bottom-0 left-0 right-0 z-40 bg-slate-900/90 backdrop-blur-md border-t border-slate-800 px-6 py-2">
        <div class="max-w-md mx-auto flex justify-around items-center">
            <button @click="switchTab('dashboard')" :class="currentTab === 'dashboard' ? 'text-emerald-400' : 'text-slate-500'" class="flex flex-col items-center gap-1 transition">
                <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
                <span class="text-[10px] font-medium">Dashboard</span>
            </button>
            <button @click="switchTab('nutrition')" :class="currentTab === 'nutrition' ? 'text-emerald-400' : 'text-slate-500'" class="flex flex-col items-center gap-1 transition">
                <i data-lucide="utensils" class="w-5 h-5"></i>
                <span class="text-[10px] font-medium">Nutrition</span>
            </button>
            <button @click="switchTab('workout')" :class="currentTab === 'workout' ? 'text-emerald-400' : 'text-slate-500'" class="flex flex-col items-center gap-1 transition">
                <i data-lucide="dumbbell" class="w-5 h-5"></i>
                <span class="text-[10px] font-medium">Workout</span>
            </button>
        </div>
    </nav>

    <!-- ALPINE JS APP LOGIC -->
    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('fitnessApp', () => ({
                currentTab: 'dashboard',
                selectedDate: new Date().toISOString().split('T')[0],
                showTargetModal: false,
                showFoodModal: false,
                showTemplateModal: false,
                activeMeal: '',
                editIndex: null,

                // Target Nutrition
                targets: { calories: 2000, p: 150, c: 200, f: 65 },
                tempTargets: {},

                // Daily Logs
                foodLogs: { breakfast: [], lunch: [], dinner: [], snacks: [] },
                newFood: { name: '', calories: null, p: null, c: null, f: null },
                currentWeight: '',

                // Workout Log & Stopwatch
                activeSession: { seconds: 0, exercises: [] },
                isTimerRunning: false,
                timerInterval: null,

                workoutTemplates: [
                    { title: 'Push Day', exercises: [{ name: 'Bench Press', sets: [{ weight: 60, reps: 10 }] }] }
                ],

                calorieChartInstance: null,

                init() {
                    this.loadTargets();
                    this.loadTemplates();
                    this.loadDateData();
                    
                    this.$nextTick(() => {
                        this.refreshIcons();
                        this.initChart();
                    });

                    this.$watch('currentTab', () => {
                        this.$nextTick(() => {
                            this.refreshIcons();
                            if (this.currentTab === 'dashboard') {
                                this.initChart();
                            }
                        });
                    });
                },

                switchTab(tab) {
                    this.currentTab = tab;
                },

                refreshIcons() {
                    lucide.createIcons();
                },

                changeDate(offset) {
                    this.stopTimer(); // Hentikan timer aktif saat pindah hari
                    let d = new Date(this.selectedDate);
                    d.setDate(d.getDate() + offset);
                    this.selectedDate = d.toISOString().split('T')[0];
                    this.loadDateData();
                },

                loadDateData() {
                    this.stopTimer();
                    const saved = localStorage.getItem(`fitpulse_data_${this.selectedDate}`);
                    if (saved) {
                        const parsed = JSON.parse(saved);
                        this.foodLogs = parsed.foodLogs || { breakfast: [], lunch: [], dinner: [], snacks: [] };
                        // Backward compatibility jika sebelumnya pakai property duration menit
                        let totalSec = parsed.activeSession?.seconds || ((parsed.activeSession?.duration || 0) * 60);
                        this.activeSession = { seconds: totalSec, exercises: parsed.activeSession?.exercises || [] };
                        this.currentWeight = parsed.currentWeight || '';
                    } else {
                        this.foodLogs = { breakfast: [], lunch: [], dinner: [], snacks: [] };
                        this.activeSession = { seconds: 0, exercises: [] };
                        this.currentWeight = '';
                    }
                    this.$nextTick(() => {
                        this.refreshIcons();
                        this.updateChart();
                    });
                },

                saveDateData() {
                    const payload = {
                        foodLogs: this.foodLogs,
                        activeSession: this.activeSession,
                        currentWeight: this.currentWeight
                    };
                    localStorage.setItem(`fitpulse_data_${this.selectedDate}`, JSON.stringify(payload));
                    this.updateChart();
                },

                // Stopwatch Logic
                toggleStopwatch() {
                    if (this.isTimerRunning) {
                        this.stopTimer();
                    } else {
                        this.startTimer();
                    }
                },

                startTimer() {
                    if (this.isTimerRunning) return;
                    this.isTimerRunning = true;
                    this.timerInterval = setInterval(() => {
                        this.activeSession.seconds++;
                        this.saveDateData();
                    }, 1000);
                    this.$nextTick(() => this.refreshIcons());
                },

                stopTimer() {
                    this.isTimerRunning = false;
                    if (this.timerInterval) {
                        clearInterval(this.timerInterval);
                        this.timerInterval = null;
                    }
                    this.saveDateData();
                    this.$nextTick(() => this.refreshIcons());
                },

                get formattedStopwatch() {
                    const totalSec = this.activeSession.seconds || 0;
                    const hrs = Math.floor(totalSec / 3600);
                    const mins = Math.floor((totalSec % 3600) / 60);
                    const secs = totalSec % 60;
                    if (hrs > 0) {
                        return `${hrs}:${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;
                    }
                    return `${mins}:${secs < 10 ? '0' : ''}${secs} min`;
                },

                loadTargets() {
                    const saved = localStorage.getItem('fitpulse_targets');
                    if (saved) this.targets = JSON.parse(saved);
                    this.tempTargets = { ...this.targets };
                },

                openTargetModal() {
                    this.tempTargets = { ...this.targets };
                    this.showTargetModal = true;
                },

                saveTargets() {
                    this.targets = { ...this.tempTargets };
                    localStorage.setItem('fitpulse_targets', JSON.stringify(this.targets));
                    this.showTargetModal = false;
                    this.updateChart();
                },

                saveWeight() {
                    this.saveDateData();
                },

                // Nutrition logic
                openAddFoodModal(meal) {
                    this.activeMeal = meal;
                    this.editIndex = null;
                    this.newFood = { name: '', calories: null, p: null, c: null, f: null };
                    this.showFoodModal = true;
                },

                openEditFoodModal(meal, idx, food) {
                    this.activeMeal = meal;
                    this.editIndex = idx;
                    this.newFood = { ...food };
                    this.showFoodModal = true;
                },

                saveFoodItem() {
                    if (!this.newFood.name) return;
                    
                    const foodData = {
                        name: this.newFood.name,
                        calories: Number(this.newFood.calories) || 0,
                        p: Number(this.newFood.p) || 0,
                        c: Number(this.newFood.c) || 0,
                        f: Number(this.newFood.f) || 0,
                    };

                    if (this.editIndex !== null) {
                        this.foodLogs[this.activeMeal][this.editIndex] = foodData;
                    } else {
                        this.foodLogs[this.activeMeal].push(foodData);
                    }

                    this.showFoodModal = false;
                    this.saveDateData();
                    this.$nextTick(() => this.refreshIcons());
                },

                removeFood(meal, index) {
                    this.foodLogs[meal].splice(index, 1);
                    this.saveDateData();
                    this.$nextTick(() => this.refreshIcons());
                },

                get consumedCalories() {
                    let total = 0;
                    Object.values(this.foodLogs).forEach(arr => arr.forEach(f => total += Number(f.calories || 0)));
                    return total;
                },

                get consumedMacros() {
                    let p = 0, c = 0, f = 0;
                    Object.values(this.foodLogs).forEach(arr => arr.forEach(item => {
                        p += Number(item.p || 0);
                        c += Number(item.c || 0);
                        f += Number(item.f || 0);
                    }));
                    return { p, c, f };
                },

                // Workout logic
                addExerciseToSession() {
                    if (!this.activeSession.exercises) {
                        this.activeSession.exercises = [];
                    }
                    this.activeSession.exercises.push({
                        name: 'New Exercise',
                        sets: [{ weight: 0, reps: 0 }]
                    });
                    this.saveDateData();
                    this.$nextTick(() => this.refreshIcons());
                },

                removeExercise(idx) {
                    this.activeSession.exercises.splice(idx, 1);
                    this.saveDateData();
                },

                addSet(exIdx) {
                    this.activeSession.exercises[exIdx].sets.push({ weight: 0, reps: 0 });
                    this.saveDateData();
                    this.$nextTick(() => this.refreshIcons());
                },

                removeSet(exIdx, setIdx) {
                    this.activeSession.exercises[exIdx].sets.splice(setIdx, 1);
                    this.saveDateData();
                },

                saveWorkoutData() {
                    this.saveDateData();
                },

                get workoutMetrics() {
                    let sets = 0, volume = 0, maxWeight = 0;
                    if (this.activeSession && this.activeSession.exercises) {
                        this.activeSession.exercises.forEach(ex => {
                            if (ex.sets) {
                                sets += ex.sets.length;
                                ex.sets.forEach(s => {
                                    const w = Number(s.weight || 0);
                                    const r = Number(s.reps || 0);
                                    volume += (w * r);
                                    if (w > maxWeight) maxWeight = w;
                                });
                            }
                        });
                    }
                    const totalMins = Math.round((this.activeSession?.seconds || 0) / 60);
                    return {
                        duration: totalMins,
                        sets: sets,
                        volume: volume,
                        maxWeight: maxWeight
                    };
                },

                // Templates Logic
                loadTemplates() {
                    const saved = localStorage.getItem('fitpulse_templates');
                    if (saved) this.workoutTemplates = JSON.parse(saved);
                },

                saveCurrentAsTemplate() {
                    if (!this.activeSession.exercises || this.activeSession.exercises.length === 0) {
                        alert("Please add at least one exercise before saving as a template.");
                        return;
                    }
                    const name = prompt("Enter Template Name:");
                    if (!name) return;
                    this.workoutTemplates.push({
                        title: name,
                        exercises: JSON.parse(JSON.stringify(this.activeSession.exercises))
                    });
                    localStorage.setItem('fitpulse_templates', JSON.stringify(this.workoutTemplates));
                    this.$nextTick(() => this.refreshIcons());
                },

                loadTemplate(tmpl) {
                    this.activeSession.exercises = JSON.parse(JSON.stringify(tmpl.exercises));
                    this.showTemplateModal = false;
                    this.saveDateData();
                    this.$nextTick(() => this.refreshIcons());
                },

                deleteTemplate(idx) {
                    this.workoutTemplates.splice(idx, 1);
                    localStorage.setItem('fitpulse_templates', JSON.stringify(this.workoutTemplates));
                },

                // Chart initialization
                initChart() {
                    const ctx = document.getElementById('calorieChart');
                    if (!ctx) return;

                    if (this.calorieChartInstance) {
                        this.calorieChartInstance.destroy();
                    }

                    this.calorieChartInstance = new Chart(ctx, {
                        type: 'doughnut',
                        data: {
                            datasets: [{
                                data: [0, this.targets.calories],
                                backgroundColor: ['#10b981', '#334155'],
                                borderWidth: 0
                            }]
                        },
                        options: {
                            cutout: '75%',
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: { tooltip: { enabled: false } }
                        }
                    });
                    this.updateChart();
                },

                updateChart() {
                    if (!this.calorieChartInstance) return;
                    const consumed = this.consumedCalories;
                    const remaining = Math.max(0, this.targets.calories - consumed);
                    this.calorieChartInstance.data.datasets[0].data = [consumed, remaining];
                    this.calorieChartInstance.update();
                }
            }));
        });
    </script>
</body>
</html>
